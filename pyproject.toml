[project]
name = "smp"
description = "Simple Management Protocol (SMP) for remotely managing MCU firmware"
readme = "README.md"
license = "Apache-2.0"
authors = [
{ name = "J.P. Hutchins", email = "jphutchins@gmail.com" },
{ name = "J.P. Hutchins", email = "jp@intercreate.io" },
]
requires-python = ">=3.10"
dependencies = [
"cbor2>=6,<7",
"crcmod>=1.7,<2",
"pydantic>=2.6,<3",
]
dynamic = ["version"]
classifiers = [
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Python :: 3.14",
"License :: OSI Approved :: Apache Software License",
"Operating System :: Microsoft :: Windows",
"Operating System :: POSIX :: Linux",
"Operating System :: MacOS :: MacOS X",
]

[project.urls]
Repository = "https://github.com/JPHutchins/smp"
Documentation = "https://jphutchins.github.io/smp/"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/smp"]

[dependency-groups]
dev = [
    "ruff>=0.15,<1",
    "mypy>=2,<3",
    "mypy-extensions>=1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "camas[mcp]==0.1.24",
    "pyright>=1.1,<2",
]
doc = [
"mkdocstrings[python]>=0.26.1,<1",
"mkdocs-material>=9.5.37,<10",
"mike>=2.1.3,<3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
"B",
"C4",
"I",
"RUF",
"SIM",
"TC",
"UP",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
disallow_untyped_defs = true
exclude = ['\.venv']

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["smp"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
"@overload",
"assert_never",
"pragma: no cover",
"if __name__ == .__main__.:",
"if TYPE_CHECKING",
':\s*\.\.\.\s*$',
'^\s*\.\.\.\s*$',
]
